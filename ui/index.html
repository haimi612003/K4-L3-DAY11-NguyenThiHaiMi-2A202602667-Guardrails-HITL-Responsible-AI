<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Guardrails Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body class="is-intro">

  <!-- ============ Painted scene (revealed from the centre) ============ -->
  <div id="reveal" class="reveal">
  <div id="scene" class="scene" aria-hidden="true">
    <div class="sky"></div>
    <div class="clouds" id="clouds"></div>
    <svg class="trees trees--far" id="treesFar" preserveAspectRatio="xMidYMax slice"></svg>
    <svg class="trees trees--mid" id="treesMid" preserveAspectRatio="xMidYMax slice"></svg>
    <svg class="bushes" id="bushes" preserveAspectRatio="xMidYMax slice"></svg>

    <!-- Floating "figures": the defender (left) and the red team (right) -->
    <div class="float float--shield" data-depth="28">
      <svg viewBox="0 0 220 260" aria-hidden="true">
        <defs>
          <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fbf7ee"/>
            <stop offset=".45" stop-color="#e9e1d0"/>
            <stop offset=".7" stop-color="#d6ccb7"/>
            <stop offset="1" stop-color="#b9ad96"/>
          </linearGradient>
          <linearGradient id="marbleEdge" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fffdf7"/>
            <stop offset="1" stop-color="#a99d86"/>
          </linearGradient>
          <filter id="veins"><feTurbulence type="fractalNoise" baseFrequency=".018 .06" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .44  0 0 0 -2.2 1.35"/><feComposite in2="SourceGraphic" operator="in"/></filter>
        </defs>
        <path d="M110 8 L200 40 C200 140 170 205 110 250 C50 205 20 140 20 40 Z" fill="url(#marble)" stroke="url(#marbleEdge)" stroke-width="5"/>
        <path d="M110 8 L200 40 C200 140 170 205 110 250 C50 205 20 140 20 40 Z" fill="#000" filter="url(#veins)" opacity=".55"/>
        <path d="M110 34 L178 58 C178 138 154 190 110 224 C66 190 42 138 42 58 Z" fill="none" stroke="#fffaf0" stroke-opacity=".7" stroke-width="2"/>
        <path d="M78 128 l22 24 l44 -52" fill="none" stroke="#6f6553" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
      </svg>
    </div>
    <div class="float float--drape" data-depth="44">
      <svg viewBox="0 0 320 300" aria-hidden="true">
        <defs>
          <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f08a78"/>
            <stop offset=".35" stop-color="#c9483d"/>
            <stop offset=".6" stop-color="#e9735f"/>
            <stop offset="1" stop-color="#8d2a24"/>
          </linearGradient>
          <linearGradient id="silkShade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
            <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
            <stop offset="1" stop-color="#000" stop-opacity=".3"/>
          </linearGradient>
        </defs>
        <!-- a hanging silk cloak: wavy hem, folds as light/dark bands -->
        <path d="M18 64 C60 34 104 58 152 40 C200 22 250 46 304 18 C300 90 306 170 296 238 C258 268 222 246 184 270 C146 292 104 262 64 284 C44 292 26 280 14 270 C22 200 12 130 18 64 Z" fill="url(#silk)"/>
        <g fill="none" stroke-linecap="round">
          <path d="M58 50 C70 120 50 200 64 282" stroke="#fff" stroke-opacity=".22" stroke-width="20"/>
          <path d="M100 52 C112 130 96 210 106 272" stroke="#4a0f0b" stroke-opacity=".32" stroke-width="16"/>
          <path d="M150 42 C160 120 146 200 158 280" stroke="#fff" stroke-opacity=".18" stroke-width="24"/>
          <path d="M205 30 C214 110 198 190 212 262" stroke="#4a0f0b" stroke-opacity=".3" stroke-width="18"/>
          <path d="M256 30 C266 110 256 180 262 250" stroke="#fff" stroke-opacity=".2" stroke-width="18"/>
          <path d="M288 22 C296 100 292 170 294 236" stroke="#4a0f0b" stroke-opacity=".28" stroke-width="10"/>
        </g>
        <path d="M18 64 C60 34 104 58 152 40 C200 22 250 46 304 18" fill="none" stroke="#ffd1c6" stroke-opacity=".6" stroke-width="3"/>
        <!-- the red team's mask -->
        <path d="M112 118 C140 102 196 102 222 118 C224 140 212 160 192 160 C180 160 172 148 167 140 C162 148 154 160 142 160 C122 160 110 140 112 118 Z" fill="#1a0d0c" opacity=".9"/>
        <ellipse cx="143" cy="132" rx="11" ry="7" fill="#f6c1b6"/>
        <ellipse cx="191" cy="132" rx="11" ry="7" fill="#f6c1b6"/>
      </svg>
    </div>
    <div class="float float--lock" data-depth="60">
      <svg viewBox="0 0 120 150" aria-hidden="true">
        <defs>
          <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff5ec4"/>
            <stop offset=".6" stop-color="#ff1a9d"/>
            <stop offset="1" stop-color="#c2007a"/>
          </linearGradient>
        </defs>
        <path d="M32 64 V44 a28 28 0 0 1 56 0 V64" fill="none" stroke="#e8e2d6" stroke-width="12" stroke-linecap="round"/>
        <rect x="14" y="62" width="92" height="78" rx="14" fill="url(#pink)"/>
        <rect x="20" y="68" width="30" height="66" rx="10" fill="#fff" opacity=".22"/>
        <circle cx="60" cy="96" r="9" fill="#5a0036"/>
        <rect x="56" y="100" width="8" height="18" rx="4" fill="#5a0036"/>
      </svg>
    </div>

    <div class="grain"></div>
  </div>
  </div>

  <!-- Glowing ragged ring that sells the reveal (fixed geometry, scaled by CSS) -->
  <svg id="revealRing" class="reveal-ring" viewBox="0 0 1000 1000" aria-hidden="true">
    <defs>
      <filter id="ragged" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feGaussianBlur in="d" stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="d"/></feMerge>
      </filter>
    </defs>
    <circle cx="500" cy="500" r="420" fill="none" stroke="#fffdf6" stroke-width="14" filter="url(#ragged)"/>
  </svg>

  <!-- Thin construction lines -->
  <svg id="lines" class="lines" aria-hidden="true"></svg>

  <!-- ============ Top bar ============ -->
  <header class="topbar">
    <a class="brand" href="#" data-home>
      <svg viewBox="0 0 20 22" aria-hidden="true"><path d="M10 1 L18.5 4.2 C18.5 12 15.8 17.6 10 21 C4.2 17.6 1.5 12 1.5 4.2 Z" fill="currentColor"/><path d="M6.2 11.2 l2.6 2.8 l5-5.8" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>VinBank Editions</span><em>Day 11 '26</em>
    </a>
    <nav class="topnav">
      <button class="navlink" id="chaptersBtn" aria-haspopup="true" aria-expanded="false">Chapters
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 L6 7.5 L9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button class="navlink" data-open="playground">Try a guardrail
        <svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9.2 9.2 L12.5 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </nav>
    <div class="topbar__right">
      <span class="status" id="serverStatus"><i></i><span>connecting…</span></span>
      <button class="pill" data-open="chat">Talk to Blue</button>
    </div>
    <div class="dropdown" id="chaptersMenu" role="menu"></div>
  </header>

  <!-- ============ Centre frame ============ -->
  <main class="frame" id="frame">
    <span class="edge edge--t" aria-hidden="true"></span>
    <span class="edge edge--r" aria-hidden="true"></span>
    <span class="edge edge--b" aria-hidden="true"></span>
    <span class="edge edge--l" aria-hidden="true"></span>
    <h1 class="title" id="title">
      <span class="title__line title__the">The</span>
      <span class="title__line title__word"><span class="w-pre">Guardr</span><i class="w-ai">ai</i><span class="w-post">ls</span></span>
      <span class="title__line title__edition">Edition</span>
    </h1>
    <div class="frame__body">
      <p class="lede">A new layer of defence.<br><span id="ledeStat">Six layers, one pipeline.</span></p>
      <ol class="chapters" id="chapterList"></ol>
    </div>
  </main>

  <p class="skip-hint" id="skipHint">click to skip</p>

  <!-- ============ Chapter overlay ============ -->
  <section class="sheet" id="sheet" aria-hidden="true" aria-labelledby="sheetTitle" role="dialog">
    <div class="sheet__inner">
      <header class="sheet__head">
        <span class="sheet__num" id="sheetNum">I</span>
        <div>
          <h2 class="sheet__title" id="sheetTitle">Chapter</h2>
          <p class="sheet__kicker" id="sheetKicker"></p>
        </div>
        <button class="sheet__close" id="sheetClose" aria-label="Close">
          <svg viewBox="0 0 16 16"><path d="M3 3 L13 13 M13 3 L3 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="sheet__content" id="sheetContent"></div>
      <footer class="sheet__foot">
        <button class="sheet__nav" id="prevBtn">← <span></span></button>
        <button class="sheet__nav" id="nextBtn"><span></span> →</button>
      </footer>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
